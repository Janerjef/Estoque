<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="css/color.css"/>
    <link rel="stylesheet" href="css/login.css"/>
    <title>Sistema de estoque</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
</head>
<body>
<form action="api/login" method="post">
    <div class="container">
        <h1 title="Zaiko: Estoque em japones">Zaiko</h1>
        <div>
            <label>Usuário</label>
            <input type="text" name="users" title="Digite seu usuario" class="inputUser"/>
        </div>
        <div>
            <label>Senha</label>
            <input type="password" name="passw" title="Digite sua senha" class="inputPassword"/>

        </div>
    </div>
</form>
</body>
</html>
