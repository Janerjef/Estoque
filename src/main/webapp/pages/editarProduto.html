<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/color.css" />
    <link rel="stylesheet" href="../css/cadastroDeProduto.css" />
    <title>editar de Produto</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header id="header">
    <h1 id="tituloDashboard">Sistema de Estoque</h1>
    <nav>
        <ul>
            <li><a href="projeto.html">Início</a></li>
            <li><a href="gerenciamento.html">Gerenciamento</a></li>
            <li><a href="#" id="btnlogout">Sair</a></li>

        </ul>
    </nav>
</header>
<main>
    <section id="form-container">
        <h2>EDITAR PRODUTO</h2>
        <form action="../api/produto/editar" method="post" id="FormCadastro">

            <input type="hidden" name="id"/>

            <div class="linhas-form">
                <label>Código de Barras</label>
                <input type="text" name="codigoBarras" id = "codigoBarras"required />
            </div>
            <div class="linhas-form">
                <label>Nome do Produto</label>
                <input type="text" name="nomeProduto" id="nomeProduto" required />
            </div>
            <div class="linhas-form">
                <label>Fabricante</label>
                <input type="text" name="fabricante"  id="fabricante" required />
            </div>
            <div class="linhas-form">
                <label>Marca</label>
                <input type="text" name="Marca" id = "Marca" required />
            </div>
            <div class="linhas-form">
                <label>Data de Fabricação</label>
                <input type="date" name="dataFabricacao" id="dataFabricacao" required />
            </div>
            <div class="linhas-form">
                <label>Data de Vencimento</label>
                <input type="date" name="dataVencimento" id="dataVencimento" required />
            </div>
            <div class="linhas-form">
                <label>Quantidade</label>
                <input type="number" name="quantidade" id="quantidade" required />
            </div>
            <div class="linhas-form">
                <label>Prateleira</label>
                <select name="prateleira_id" id ="prateleira_id" required>
                    <option value="" disabled selected>Selecione a prateleira</option>
                </select>
            </div>


            <div class="linhas-form">
                <label>EstoqueMínimo</label>
                <input type="number" name="EstoqueMínimo" id="EstoqueMínimo"  required />
            </div>
            <div class="grupo-form">
                <label>Valor unitário</label>
                <input type="number" step="0.01" name="valor" required />
            </div>
            <div class="linhas-form">
                <div class="grupo-form full">
                    <label>Total</label>
                    <input type="number" step="0.01" name="total" required />
                </div>
            </div>
            <div class="linhas-form">
                <label>Tipo de Movimentação</label>
                <select name="status" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>
            <div class="acoes-form">
                <button type="submit" class="btn-salvar">Salvar</button>
                <a href="projeto.html" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </section>
</main>
<script src="../js/editarProduto.js"></script>
<script src="../js/logout.js"></script>
</body>
</html>
